<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tracklist</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="game">

    <section id="album-selection">

      <h1>Tracklist</h1>

      <p>Choose an album:</p>

      <div id="album-list"></div>

    </section>

    <section id="game-screen">

      <img id="album-artwork" class="game-artwork" src="" alt="">

      <h1>Tracklist</h1>

      <h2 id="album-name"></h2>
      <p class="artist" id="artist-name"></p>

      <p>Put the tracks in the correct order:</p>

      <div id="track-list"></div>

      <button id="submit-button">Submit</button>

      <h2 id="score"></h2>

      <button id="play-again-button">Play Again</button>

      <button id="album-select-button">Choose Another Album</button>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>

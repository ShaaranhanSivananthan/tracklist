<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Order the Album is a music trivia game where you put an album's tracks in the correct order. Choose an artist, pick an album, and test your tracklist knowledge."
    >

    <meta name="theme-color" content="#111111">

    <!-- Canonical URL -->
    <link
        rel="canonical"
        href="https://orderthealbum.com/"
    >

    <!-- Open Graph / Social Sharing -->
    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:title"
        content="Order the Album — Music Trivia Game"
    >

    <meta
        property="og:description"
        content="Can you put an album's tracks in the correct order? Test your music knowledge with Order the Album."
    >

    <meta
        property="og:url"
        content="https://orderthealbum.com/"
    >

    <!--
        Add your social preview image here later:
        <meta property="og:image" content="https://orderthealbum.com/og-image.jpg">
    -->

    <!-- Twitter / X -->
    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="Order the Album — Music Trivia Game"
    >

    <meta
        name="twitter:description"
        content="Can you put an album's tracks in the correct order?"
    >

    <title>Order the Album — Music Trivia Game</title>

    <link
        rel="icon"
        type="image/png"
        sizes="64x64"
        href="/favicon.png"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <!-- ==================== ARTIST SCREEN ==================== -->

        <section
            id="artist-screen"
            class="screen"
            aria-labelledby="artist-title"
        >

            <header class="screen-header">
                <h1 id="artist-title">Order the Album</h1>

                <p class="tagline">
                    Put the tracks in the right order.
                </p>

                <p class="screen-instruction">
                    Choose an artist
                </p>
            </header>

            <div
                id="artist-list"
                class="artist-list"
                aria-label="Artists"
            ></div>

        </section>


        <!-- ==================== ALBUM SCREEN ==================== -->

        <section
            id="album-screen"
            class="screen"
            aria-labelledby="album-title"
            hidden
        >

            <button
                id="back-to-artists"
                class="secondary-button back-button"
                type="button"
            >
                ← Artists
            </button>

            <header class="screen-header">
                <h1 id="album-title">Choose an Album</h1>
                <p id="album-subtitle"></p>
            </header>

            <div
                id="album-list"
                class="album-list"
                aria-label="Albums"
            ></div>

        </section>


        <!-- ==================== GAME SCREEN ==================== -->

        <section
            id="game-screen"
            class="screen"
            aria-labelledby="game-title"
            hidden
        >

            <button
                id="back-to-albums"
                class="secondary-button back-button"
                type="button"
            >
                ← Albums
            </button>

            <header class="screen-header">
                <img
                    id="game-cover"
                    class="game-cover"
                    src=""
                    alt=""
                >

                <h1 id="game-title"></h1>
            </header>

            <div
                id="game-status"
                class="game-status"
                role="status"
                aria-live="polite"
            >
                Put the tracks in the correct order.
            </div>

            <div
                id="track-list"
                class="track-list"
                role="list"
                aria-label="Tracks to order"
            ></div>

            <div class="game-actions">
                <button
                    id="submit-button"
                    class="primary-button"
                    type="button"
                >
                    Check Answer
                </button>
            </div>

        </section>


        <!-- ==================== RESULTS SCREEN ==================== -->

        <section
            id="results-screen"
            class="screen"
            aria-labelledby="results-title"
            hidden
        >

            <header class="screen-header">
                <h1 id="results-title">Results</h1>

                <div
                    id="score"
                    class="score"
                    aria-live="polite"
                ></div>

                <p id="results-message"></p>
            </header>

            <div
                id="results-list"
                class="results-list"
                role="list"
                aria-label="Answer results"
            ></div>

            <div class="game-actions results-actions">
            
                <button
                    id="download-result-button"
                    class="secondary-button"
                    type="button"
                >
                    ↓ Download Image
                </button>
            
                <button
                    id="share-result-button"
                    class="secondary-button"
                    type="button"
                >
                    ↗ Share Image
                </button>
            
                <button
                    id="copy-result-button"
                    class="secondary-button"
                    type="button"
                >
                    ⧉ Copy Image
                </button>
            
                <button
                    id="play-again-button"
                    class="primary-button"
                    type="button"
                >
                    Play Again
                </button>
            
                <button
                    id="choose-album-button"
                    class="primary-button"
                    type="button"
                >
                    Choose Another Album
                </button>
            
                <button
                    id="choose-artist-button"
                    class="primary-button"
                    type="button"
                >
                    Choose Another Artist
                </button>
            
            </div>

        </section>

    </main>


    <noscript>
        <div class="noscript-message">
            This game requires JavaScript to be enabled.
        </div>
    </noscript>


    <script src="music-data.js" defer></script>
    <script src="script.js" defer></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tracklist</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="game">

    <h1>Tracklist</h1>

    <h2>Graduation</h2>
    <p class="artist">Kanye West</p>

    <p>Put the tracks in the correct order:</p>

    <div id="track-list">

      <div class="track">Track 1</div>
      <div class="track">Track 2</div>
      <div class="track">Track 3</div>
      <div class="track">Track 4</div>
      <div class="track">Track 5</div>

    </div>

    <button id="submit-button">Submit</button>

    <h2 id="score"></h2>

  </main>

  <script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Test your music knowledge by putting album tracks in the correct order."
    >

    <meta name="theme-color" content="#111111">

    <title>Order the Album Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <!-- ==================== ARTIST SCREEN ==================== -->

        <section id="artist-screen" class="screen" aria-labelledby="artist-title">

            <header class="screen-header">
                <h1 id="artist-title">Order the Album</h1>
                <p>Choose an artist</p>
            </header>

            <div
                id="artist-list"
                class="artist-list"
                aria-label="Artists"
            ></div>

        </section>


        <!-- ==================== ALBUM SCREEN ==================== -->

        <section
            id="album-screen"
            class="screen"
            aria-labelledby="album-title"
            hidden
        >

            <button
                id="back-to-artists"
                class="secondary-button back-button"
                type="button"
            >
                ← Artists
            </button>

            <header class="screen-header">
                <h1 id="album-title">Choose an Album</h1>
                <p id="album-subtitle"></p>
            </header>

            <div
                id="album-list"
                class="album-list"
                aria-label="Albums"
            ></div>

        </section>


        <!-- ==================== GAME SCREEN ==================== -->

        <section
            id="game-screen"
            class="screen"
            aria-labelledby="game-title"
            hidden
        >

            <button
                id="back-to-albums"
                class="secondary-button back-button"
                type="button"
            >
                ← Albums
            </button>

            <header class="screen-header">
                <img
                    id="game-cover"
                    class="game-cover"
                    src=""
                    alt=""
                >

                <h1 id="game-title"></h1>
            </header>

            <div
                id="game-status"
                class="game-status"
                role="status"
                aria-live="polite"
            >
                Drag the tracks into the correct order.
            </div>

            <div
                id="track-list"
                class="track-list"
                role="list"
                aria-label="Tracks to order"
            ></div>

            <div class="game-actions">
                <button
                    id="submit-button"
                    class="primary-button"
                    type="button"
                >
                    Check Answer
                </button>
            </div>

        </section>


        <!-- ==================== RESULTS SCREEN ==================== -->

        <section
            id="results-screen"
            class="screen"
            aria-labelledby="results-title"
            hidden
        >

            <header class="screen-header">
                <h1 id="results-title">Results</h1>

                <div
                    id="score"
                    class="score"
                    aria-live="polite"
                ></div>

                <p id="results-message"></p>
            </header>

            <div
                id="results-list"
                class="results-list"
                role="list"
                aria-label="Answer results"
            ></div>

            <div class="game-actions results-actions">

                <button
                    id="play-again-button"
                    class="primary-button"
                    type="button"
                >
                    Play Again
                </button>

                <button
                    id="choose-album-button"
                    class="secondary-button"
                    type="button"
                >
                    Choose Another Album
                </button>

                <button
                    id="choose-artist-button"
                    class="secondary-button"
                    type="button"
                >
                    Choose Another Artist
                </button>

            </div>

        </section>

    </main>


    <noscript>
        <div class="noscript-message">
            This game requires JavaScript to be enabled.
        </div>
    </noscript>


    <!--
        MUSIC DATA MUST LOAD BEFORE SCRIPT.JS.
    -->
    <script src="music-data.js" defer></script>
    <script src="script.js" defer></script>

</body>
</html>

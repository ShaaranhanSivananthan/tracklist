<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracklist Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="game">

    <!-- ARTIST SELECTION SCREEN -->
    <section id="artist-screen">
      <h1>Tracklist</h1>
      <p>Choose an artist:</p>
      <div id="artist-list"></div>
    </section>

    <!-- ALBUM SELECTION SCREEN -->
    <section id="album-screen" style="display: none;">
      <h1>Tracklist</h1>
      <h2 id="selected-artist"></h2>
      <p>Choose an album:</p>
      <div id="album-list"></div>
      <button id="back-to-artists-button">Choose Another Artist</button>
    </section>

    <!-- GAME SCREEN -->
    <section id="game-screen" style="display: none;">
      <h1>Tracklist</h1>
      <h2 id="game-album"></h2>
      <p class="artist" id="game-artist"></p>
      <p id="game-status">Put the tracks in the correct order:</p>

      <div id="track-list"></div>

      <button id="submit-button">Submit</button>

      <h2 id="score"></h2>

      <div id="game-controls" style="display: none;">
        <button id="play-again-button">Play Again</button>
        <button id="choose-album-button">Choose Another Album</button>
        <button id="choose-artist-button">Choose Another Artist</button>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>

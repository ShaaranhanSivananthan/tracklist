<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tracklist</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="game">

    <!-- ARTIST SEARCH -->

    <section id="artist-screen">

      <h1>Tracklist</h1>

      <p>Search for an artist:</p>

      <div class="search-box">

        <input
          type="text"
          id="artist-search"
          placeholder="Artist name"
          autocomplete="off"
        >

        <button id="artist-search-button">
          Search
        </button>

      </div>

      <p id="artist-status"></p>

      <div id="artist-list"></div>

    </section>


    <!-- ALBUM SELECTION -->

    <section id="album-screen">

      <h1>Tracklist</h1>

      <p id="selected-artist"></p>

      <h2>Choose an album:</h2>

      <p id="album-status"></p>

      <div id="album-list"></div>

      <button id="back-to-artists-button">
        Choose Another Artist
      </button>

    </section>


    <!-- VERSION SELECTION -->

    <section id="version-screen">

      <h1>Tracklist</h1>

      <h2 id="selected-album"></h2>

      <p id="version-artist"></p>

      <p>Choose a version:</p>

      <p id="version-status"></p>

      <div id="version-list"></div>

      <button id="back-to-albums-button">
        Back to Albums
      </button>

    </section>


    <!-- GAME -->

    <section id="game-screen">

      <h1>Tracklist</h1>

      <h2 id="game-album"></h2>

      <p class="artist" id="game-artist"></p>

      <p id="game-version"></p>

      <p>Put the tracks in the correct order:</p>

      <div id="game-status"></div>

      <div id="track-list"></div>

      <button id="submit-button">
        Submit
      </button>

      <h2 id="score"></h2>

      <button id="play-again-button">
        Play Again
      </button>

      <button id="choose-album-button">
        Choose Another Album
      </button>

      <button id="choose-artist-button">
        Choose Another Artist
      </button>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
